name: External documentation links

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check external documentation links
        id: links
        continue-on-error: true
        run: python3 scripts/check_external_links.py
      - name: Publish report
        if: always()
        run: cat external-links-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: external-links-report
          path: external-links-report.md
          retention-days: 30
      - name: Report unavailable links
        if: steps.links.outcome == 'failure'
        run: |
          echo 'External links need review; see the workflow summary.'
          exit 1
