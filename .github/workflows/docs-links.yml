name: External documentation links

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  UVW_GIT_COMMIT: never

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check external documentation links
        id: links
        continue-on-error: true
        run: ./scripts/uv run --locked python scripts/check_external_links.py
      - name: Publish report
        if: always()
        run: cat external-links-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: external-links-report
          path: external-links-report.md
          retention-days: 30
      - name: Report unavailable links
        if: steps.links.outcome == 'failure'
        run: |
          echo 'External links need review; see the workflow summary.'
          exit 1
