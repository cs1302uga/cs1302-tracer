name: Deploy documentation

on:
  workflow_run:
    workflows: ['CI / Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

env:
  UVW_GIT_COMMIT: never

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       !startsWith(github.event.workflow_run.head_branch, 'release/') &&
       !startsWith(github.event.workflow_run.head_branch, 'docs-') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always rebuild current main: old release retries cannot roll the site back.
      # Never execute PR code or consume artifacts from the triggering workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: ./.github/actions/configure-maven
      # Reuse main's cache, retaining workflow_run's read-only cache permission.
      # The builder checks each entry's source/toolchain key and file digests.
      - name: Restore historical Javadoc
        id: javadoc-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/docsite/javadoc
          key: javadoc-v1-${{ runner.os }}-${{ runner.arch }}-lookup
          restore-keys: javadoc-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Select published stable documentation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/releases.json"
      # Authenticate published API artifacts; older releases retain exact tagged-source generation.
      - name: Build and verify published documentation with the Maven Site renderer
        run: >-
          ./mvnw -B -ntp -Pdocsite -DskipTests
          -Ddocsite.mode=published
          -Ddocsite.javadocSource=auto
          "-Ddocsite.releases=$RUNNER_TEMP/releases.json" verify
      # Manual main deployments may populate the cache after full validation.
      # Immutable transport keys follow validated manifests, not checkout SHAs.
      - name: Identify validated Javadoc cache
        id: javadoc-cache-key
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          CACHE_PREFIX: javadoc-v1-${{ runner.os }}-${{ runner.arch }}-
          MANIFEST_DIGEST: ${{ hashFiles('.cache/docsite/javadoc/*/manifest.json') }}
        run: |
          if [[ -n "$MANIFEST_DIGEST" ]]; then
            printf 'key=%s%s\n' "$CACHE_PREFIX" "$MANIFEST_DIGEST" >> "$GITHUB_OUTPUT"
          fi
      - name: Save validated historical Javadoc
        if: >-
          github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          steps.javadoc-cache-key.outputs.key != '' &&
          steps.javadoc-cache-restore.outputs.cache-matched-key != steps.javadoc-cache-key.outputs.key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/docsite/javadoc
          key: ${{ steps.javadoc-cache-key.outputs.key }}
      - name: Retain deployment source manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-source-manifest
          path: target/pages/release-manifest.json
          retention-days: 7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/pages
      - name: Save documentation timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-deployment-timings
          path: |
            target/docsite/build-timings.json
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Re-read current main and published releases immediately before deploying the artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-source-manifest
          path: target/pages
      - name: Reject stale deployment sources
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/releases.json"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          ./scripts/uv run --locked python scripts/docs_site.py check-inputs --mode published --releases "$RUNNER_TEMP/releases.json"
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
