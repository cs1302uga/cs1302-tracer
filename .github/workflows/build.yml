name: CI / Release

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java: [ '21', '25' ]
        include:
          - os: macos-latest
            java: '21'
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - name: Build and test with Maven
        run: mvn clean package
      - name: Verify trace compatibility
        run: |
          python3 -m unittest discover -s examples -p test_verify.py
          python3 examples/verify.py

  release:
    permissions:
      contents: write
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn clean package -DskipTests
      - run: |
          mv target/code-tracer*.jar target/code-tracer.jar
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files:
            target/*.jar
