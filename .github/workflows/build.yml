name: CI / Release

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build tracer
        run: ./mvnw -B -ntp package -DskipTests
      - name: Check executable documentation
        run: |
          python3 scripts/check_docs.py
          python3 scripts/docs_release.py check
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Retain existing documentation versions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/docs_release.py check --base "$BASE_SHA"
      - name: Verify release snapshot and ancestry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/docs_release.py check --tag "$RELEASE_TAG"
      - run: npm --prefix website ci
      - run: npm --prefix website run build
      - run: python3 scripts/check_site.py
      - name: Save reviewable site
        uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: website/build
          retention-days: 7

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - name: Build and test with Maven
        run: ./mvnw -B -ntp clean package
      - name: Verify trace compatibility
        run: |
          python3 -m unittest discover -s examples -p test_verify.py
          python3 examples/verify.py

  windows-wrapper:
    name: Windows wrapper (Java ${{ matrix.java }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Bootstrap wrapper and compile
        shell: cmd
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/tracer-wrapper-smoke
        run: |
          call mvnw.cmd -B -ntp --version
          if errorlevel 1 exit /b 1
          call mvnw.cmd -B -ntp -DskipTests -Djacoco.skip=true test-compile

  release:
    permissions:
      contents: write
    needs: [test, documentation, windows-wrapper]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: ./mvnw -B -ntp clean package -DskipTests
      - run: |
          mv target/code-tracer*.jar target/code-tracer.jar
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files:
            target/*.jar
