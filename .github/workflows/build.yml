name: CI / Release

on:
  push:
    branches: [ "main", "release/**" ]
    tags:
      - '*'
      # Documentation artifact tags have their own attested publisher and are not software releases.
      - '!docs-*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  UVW_GIT_COMMIT: never

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: ./.github/actions/configure-maven
      # Restore only here; trusted main pushes populate this shared namespace.
      # The builder checks each entry's source/toolchain key and file digests.
      - name: Restore historical Javadoc
        id: javadoc-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/.cache/javadoc
          key: javadoc-v1-${{ runner.os }}-${{ runner.arch }}-lookup
          restore-keys: javadoc-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Print OS and JDK details
        shell: bash
        run: |
          echo '::group::OS details'
          uname -srm
          if [[ "$RUNNER_OS" == macOS ]]; then
            sw_vers
          else
            cat /etc/os-release
          fi
          echo '::endgroup::'
          echo '::group::JDK details'
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME"
          command -v java
          java -version
          command -v javac
          javac -version
          echo '::endgroup::'
      - name: Bootstrap release documentation tools
        if: github.event_name == 'push'
        run: |
          ./mvnw -B -ntp -Pdocsite initialize
          echo "$PWD/target/frontend/node" >> "$GITHUB_PATH"
      - name: Validate release branch and pending documentation revision
        id: release-context
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: ./scripts/uv run --locked python scripts/release.py ci --branch "$RELEASE_BRANCH" --github-output "$GITHUB_OUTPUT"
      - name: Retain existing documentation versions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/uv run --locked python scripts/docs_release.py check --base "$BASE_SHA"
      - name: Verify release snapshot and ancestry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          ./scripts/uv run --locked python scripts/docs_release.py check --tag "$RELEASE_TAG"
      - name: Build and verify documentation with the pinned frontend toolchain
        run: >-
          ./mvnw -B -ntp -Pdocsite -DskipTests
          "-Ddocsite.pendingCommit=${{ steps.release-context.outputs.pending_commit }}" verify
      # Immutable transport keys follow validated manifests, not checkout SHAs.
      - name: Identify validated Javadoc cache
        id: javadoc-cache-key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CACHE_PREFIX: javadoc-v1-${{ runner.os }}-${{ runner.arch }}-
          MANIFEST_DIGEST: ${{ hashFiles('website/.cache/javadoc/*/manifest.json') }}
        run: |
          if [[ -n "$MANIFEST_DIGEST" ]]; then
            printf 'key=%s%s\n' "$CACHE_PREFIX" "$MANIFEST_DIGEST" >> "$GITHUB_OUTPUT"
          fi
      - name: Save validated historical Javadoc
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.javadoc-cache-key.outputs.key != '' &&
          steps.javadoc-cache-restore.outputs.cache-matched-key != steps.javadoc-cache-key.outputs.key
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/.cache/javadoc
          key: ${{ steps.javadoc-cache-key.outputs.key }}
      - name: Save reviewable site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-preview
          path: website/build
          retention-days: 7
      - name: Save documentation timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-timings
          path: |
            website/build-timings.json
            website/npm-ci-timing.json
          if-no-files-found: ignore
          retention-days: 7

  scripts-quality:
    name: Scripts quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UVW_GIT_COMMIT: never
      COVERAGE_RCFILE: ${{ github.workspace }}/scripts/pyproject.toml
      COVERAGE_FILE: ${{ github.workspace }}/.coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked managed Python tooling
        run: ./scripts/uv sync --locked
      - name: Check Maven version ownership
        run: ./scripts/uv run --locked python scripts/check_pom.py
      - name: Test documentation navigation, dependency controls, and isolated guides
        run: node --test --experimental-test-coverage website/tests/*.test.cjs
      - name: Lint, format, and type-check scripts
        run: |
          ./scripts/uv run --locked ruff check scripts
          ./scripts/uv run --locked ruff format --check scripts
          ./scripts/uv run --locked ty check scripts
      - name: Test scripts with complete line and branch coverage
        run: |
          ./scripts/uv run --locked coverage erase
          ./scripts/uv run --locked coverage run -m unittest discover -s scripts/tests -t scripts
          ./scripts/uv run --locked coverage combine
          ./scripts/uv run --locked coverage report

  test:
    name: Java (${{ matrix.os }}, ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - uses: ./.github/actions/configure-maven
      - name: Print OS and JDK details
        shell: bash
        run: |
          echo '::group::OS details'
          uname -srm
          if [[ "$RUNNER_OS" == macOS ]]; then
            sw_vers
          else
            cat /etc/os-release
          fi
          echo '::endgroup::'
          echo '::group::JDK details'
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME"
          command -v java
          java -version
          command -v javac
          javac -version
          echo '::endgroup::'
      - name: Build and test with Maven
        run: ./mvnw -B -ntp clean package
      - name: Verify launcher distribution
        shell: bash
        run: |
          unset CODE_TRACER_JAR_DIR
          ./target/code-tracer --version
          ./target/code-tracer --help
          test "$(readlink target/code-tracer)" = code-tracer.sh
          test ! -e target/code-tracer.bat
          python3 - <<'PY'
          import stat, subprocess, tarfile, zipfile
          from pathlib import Path
          metadata_path = 'cs1302/tracer/version.properties'
          with zipfile.ZipFile('target/code-tracer.jar') as jar:
              metadata = jar.read(metadata_path)
          version = dict(line.split('=', 1) for line in metadata.decode().splitlines())['version']
          with zipfile.ZipFile(f'target/cs1302-tracer-{version}.jar') as jar:
              assert jar.read(metadata_path) == metadata
          provenance = Path('target/build-provenance.properties').read_text()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert f'git.commit={head}' in provenance.splitlines()
          expected = {'code-tracer', 'code-tracer.sh', 'code-tracer.ps1', 'code-tracer.cmd', 'code-tracer.jar', 'LICENSE'}
          with zipfile.ZipFile('target/code-tracer-bin.zip') as zip:
              entries = {Path(m.filename).name: m for m in zip.infolist() if not m.is_dir()}
              assert set(entries) == expected
              assert stat.S_ISREG(entries['code-tracer'].external_attr >> 16)
              assert zip.read(entries['code-tracer']) == zip.read(entries['code-tracer.sh'])
              assert b'\n' not in zip.read(entries['code-tracer.cmd']).replace(b'\r\n', b'')
              for extension in ('tar.gz', 'tar.xz'):
                  with tarfile.open(f'target/code-tracer-bin.{extension}') as tar:
                      members = {Path(m.name).name: m for m in tar.getmembers() if not m.isdir()}
                      assert set(members) == expected
                      assert members['code-tracer'].issym() and members['code-tracer'].linkname == 'code-tracer.sh'
                      for name in expected - {'code-tracer'}:
                          assert members[name].isfile()
                          assert members[name].mode & 0o777 == (0o755 if name == 'code-tracer.sh' else 0o644)
                          assert tar.extractfile(members[name]).read() == zip.read(entries[name])
          PY
          smoke_root=$(mktemp -d)
          trap 'rm -rf "$smoke_root"' EXIT
          for extension in tar.gz tar.xz; do
            smoke_dir="$smoke_root/$extension launcher smoke"
            mkdir -p "$smoke_dir"
            tar -xf "target/code-tracer-bin.$extension" -C "$smoke_dir"
            mv "$smoke_dir/code-tracer" "$smoke_dir/relocated application"
            test "$(readlink "$smoke_dir/relocated application/code-tracer")" = code-tracer.sh
            test -x "$smoke_dir/relocated application/code-tracer"
            cmp target/code-tracer.jar "$smoke_dir/relocated application/code-tracer.jar"
            (
              cd "$smoke_dir"
              printf '%s\n' 'public class Main { public static void main(String[] args) { System.out.println(42); } }' > Main.java
              './relocated application/code-tracer.sh' --version
              './relocated application/code-tracer' trace -i Main.java -a -f modern > trace.json
              mkdir 'separate jars'
              mv 'relocated application/code-tracer.jar' 'separate jars/'
              CODE_TRACER_JAR_DIR='./separate jars/' './relocated application/code-tracer' trace -i Main.java -a -f modern > override.json
              CODE_TRACER_JAR_DIR="$PWD/separate jars" './relocated application/code-tracer.sh' --version
            )
            python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["steps"]' "$smoke_dir/trace.json"
            python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["steps"]' "$smoke_dir/override.json"
          done
      - name: Build the extracted source distribution
        shell: bash
        run: |
          source_root=$(mktemp -d)
          trap 'rm -rf "$source_root"' EXIT
          tar -xf target/code-tracer-src.tar.xz -C "$source_root"
          cp target/build-provenance.properties "$source_root/expected-provenance.properties"
          cd "$source_root/code-tracer"
          ./mvnw -B -ntp -DskipTests -Djacoco.skip=true package
          cmp "$source_root/expected-provenance.properties" target/build-provenance.properties
          ./target/code-tracer --version
      - name: Verify trace compatibility
        run: |
          python3 -m unittest discover -s examples -p test_verify.py
          python3 examples/verify.py

  windows-wrapper:
    name: Windows packaging and launchers (Java ${{ matrix.java }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - uses: ./.github/actions/configure-maven
      - name: Print OS and JDK details
        shell: pwsh
        run: |
          Write-Output '::group::OS details'
          [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          Write-Output '::endgroup::'
          Write-Output '::group::JDK details'
          Write-Output "JAVA_HOME=$env:JAVA_HOME"
          (Get-Command java -CommandType Application).Source
          java -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-Command javac -CommandType Application).Source
          javac -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output '::endgroup::'
      - name: Bootstrap wrapper and package
        shell: cmd
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/tracer-wrapper-smoke
        run: |
          call mvnw.cmd -B -ntp --version
          if errorlevel 1 exit /b 1
          call mvnw.cmd -B -ntp -DskipTests -Djacoco.skip=true package
      - name: Analyze Windows launchers and test documented JDK selection
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Repository PSGallery -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Repository PSGallery -Force
          Import-Module Pester -RequiredVersion 6.2.0
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $diagnostics = @(Invoke-ScriptAnalyzer src/main/scripts/code-tracer.ps1)
          if ($diagnostics.Count) { $diagnostics | Format-Table; throw 'PowerShell analysis failed' }
          Invoke-Pester -Path scripts/tests/WindowsLauncher.Tests.ps1, scripts/tests/WindowsDocumentation.Tests.ps1 -CI
      - name: Verify Windows launcher distribution
        shell: pwsh
        run: |
          Remove-Item Env:CODE_TRACER_JAR_DIR -ErrorAction SilentlyContinue
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'launcher smoke'
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          Expand-Archive target/code-tracer-bin.zip -DestinationPath $smokeRoot -Force
          $installed = Join-Path $smokeRoot 'code-tracer'
          if (Test-Path target/code-tracer.bat) { throw 'Stale batch launcher remains' }
          if (Test-Path "$installed/code-tracer.bat") { throw 'ZIP includes old batch launcher' }
          if ((Get-FileHash "$installed/code-tracer").Hash -ne (Get-FileHash "$installed/code-tracer.sh").Hash) {
            throw 'ZIP Bash alias differs from source launcher'
          }
          if ((Get-FileHash target/code-tracer.jar).Hash -ne (Get-FileHash "$installed/code-tracer.jar").Hash) {
            throw 'Packaged JAR differs'
          }
          foreach ($extension in @('ps1', 'cmd')) {
            & "./target/code-tracer.$extension" --version
            if ($LASTEXITCODE -ne 0) { throw 'Version invocation failed' }
            & "./target/code-tracer.$extension" --help
            if ($LASTEXITCODE -ne 0) { throw 'Help invocation failed' }
          }
          Push-Location $smokeRoot
          try {
            'public class Main { public static void main(String[] args) { System.out.println(42); } }' |
              Set-Content Main.java -Encoding utf8
            foreach ($extension in @('ps1', 'cmd')) {
              & "$installed/code-tracer.$extension" trace -i Main.java -a -f modern > "trace-$extension.json"
              if ($LASTEXITCODE -ne 0) { throw 'Trace invocation failed' }
              $trace = Get-Content "trace-$extension.json" -Raw | ConvertFrom-Json
              if (-not $trace.steps.Count) { throw 'Trace contains no steps' }
            }
            New-Item -ItemType Directory -Path 'separate jars' | Out-Null
            Move-Item "$installed/code-tracer.jar" 'separate jars/'
            foreach ($extension in @('ps1', 'cmd')) {
              foreach ($directory in @('./separate jars/', (Join-Path $smokeRoot 'separate jars'))) {
                $env:CODE_TRACER_JAR_DIR = $directory
                & "$installed/code-tracer.$extension" trace -i Main.java -a -f modern > "override-$extension.json"
                if ($LASTEXITCODE -ne 0) { throw 'Separate JAR invocation failed' }
                $trace = Get-Content "override-$extension.json" -Raw | ConvertFrom-Json
                if (-not $trace.steps.Count) { throw 'Separate JAR trace contains no steps' }
              }
            }
          } finally {
            Remove-Item Env:CODE_TRACER_JAR_DIR -ErrorAction SilentlyContinue
            Pop-Location
            Remove-Item $smokeRoot -Recurse -Force
          }

  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [test, documentation, windows-wrapper, scripts-quality]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - uses: ./.github/actions/configure-maven
      - name: Print OS and JDK details
        shell: bash
        run: |
          echo '::group::OS details'
          uname -srm
          if [[ "$RUNNER_OS" == macOS ]]; then
            sw_vers
          else
            cat /etc/os-release
          fi
          echo '::endgroup::'
          echo '::group::JDK details'
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME"
          command -v java
          java -version
          command -v javac
          javac -version
          echo '::endgroup::'
      - name: Build with Maven
        run: ./mvnw -B -ntp -Prelease-javadoc clean package -DskipTests
      - name: Validate Javadoc release identity and checksum
        id: release-artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$version"
          javadoc="target/cs1302-tracer-$version-javadoc.jar"
          ./scripts/uv run --locked python scripts/javadoc_artifact.py check "$javadoc" \
            --version "$version" --commit "$GITHUB_SHA"
          printf 'library=target/cs1302-tracer-%s.jar\njavadoc=%s\nversion=%s\n' \
            "$version" "$javadoc" "$version" >> "$GITHUB_OUTPUT"
      # A retry reuses a verified complete trio; partial uploads require explicit recovery.
      - name: Preserve existing Javadoc release artifacts
        id: preserve-javadoc
        env:
          GH_TOKEN: ${{ github.token }}
          JAVADOC_JAR: ${{ steps.release-artifacts.outputs.javadoc }}
          RELEASE_VERSION: ${{ steps.release-artifacts.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/uv run --locked python scripts/javadoc_publish.py preserve "$JAVADOC_JAR" \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --repository "$REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"
      # Sign fresh final bytes in this checked tag job; caches are never release evidence.
      - name: Attest Javadoc release artifact
        id: attest-javadoc
        if: steps.preserve-javadoc.outputs.preserved == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/${{ steps.release-artifacts.outputs.javadoc }}
          create-storage-record: false
      - name: Retain new Javadoc attestation bundle
        if: steps.preserve-javadoc.outputs.preserved == 'false'
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-javadoc.outputs.bundle-path }}
          JAVADOC_JAR: ${{ steps.release-artifacts.outputs.javadoc }}
        run: cp -- "$ATTESTATION_BUNDLE" "$JAVADOC_JAR.sigstore.json"
      - name: Verify Javadoc release attestation
        env:
          JAVADOC_JAR: ${{ steps.release-artifacts.outputs.javadoc }}
          RELEASE_VERSION: ${{ steps.release-artifacts.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/uv run --locked python scripts/javadoc_artifact.py verify "$JAVADOC_JAR" \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --repository "$REPOSITORY"
      # Runtime assets retain their existing retry behavior; only Javadoc bytes are frozen.
      - name: Publish runtime release files
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Keep a new release private until the following step uploads all required Javadoc files.
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            target/code-tracer.jar
            target/code-tracer-bin.tar.gz
            target/code-tracer-bin.tar.xz
            target/code-tracer-bin.zip
            ${{ steps.release-artifacts.outputs.library }}
      - name: Publish frozen Javadoc release files
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            ${{ steps.release-artifacts.outputs.javadoc }}
            ${{ steps.release-artifacts.outputs.javadoc }}.sha256
            ${{ steps.release-artifacts.outputs.javadoc }}.sigstore.json
      - name: Verify published Javadoc release files
        env:
          GH_TOKEN: ${{ github.token }}
          JAVADOC_JAR: ${{ steps.release-artifacts.outputs.javadoc }}
          RELEASE_VERSION: ${{ steps.release-artifacts.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/uv run --locked python scripts/javadoc_publish.py verify "$JAVADOC_JAR" \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --repository "$REPOSITORY"
